{% extends 'base.html' %}

{% block title %}{{ page_title }} - {{ block.super }}{% endblock %}

{% block content %}
<h2>{{ page_title }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Restaurant</button>
</form>

{% if restaurant %}
<p><a href="{% url 'core:restaurant_detail' restaurant.id %}">Back to Restaurant</a></p>
{% endif %}
{% endblock %}
