{% extends 'base.html' %}

{% block title %}Logged Out - {{ block.super }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="card border-0 rounded-3 shadow-sm" style="max-width: 400px; margin: 0 auto; border-top: 5px solid var(--primary-green);">
        <div class="card-body p-5">
            <i class="fas fa-check-circle" style="font-size: 3rem; color: var(--primary-green); margin-bottom: 1rem; display: block;"></i>
            <h3 class="mb-3">Logged Out</h3>
            <p class="text-muted mb-4">You have been successfully logged out.</p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt"></i> Back to Login
            </a>
            <a href="{% url 'core:home' %}" class="btn btn-outline-primary w-100 mt-2">
                <i class="fas fa-home"></i> Go to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
